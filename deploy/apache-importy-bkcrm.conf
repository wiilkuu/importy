# Importy do Optimy pod adresem /importy/ witryny bkcrm (instalacja: instaluj-apache.sh --w-bkcrm).
# Instalator podstawia @NET@ i zapisuje plik jako /etc/bkcrm/apache.d/importy.conf — witryna bkcrm dołącza go (IncludeOptional).
# Sama strona statyczna: pliki XML są przetwarzane w przeglądarce, nic nie trafia na serwer.

Alias /importy /opt/importy/www
<Directory /opt/importy/www>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    DirectoryIndex index.html
    Require ip @NET@ 127.0.0.1 ::1
    Header set Cache-Control "no-cache"
</Directory>
