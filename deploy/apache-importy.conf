# Importy do Optimy — osobna witryna (instalacja: instaluj-apache.sh <nazwa-hosta>). Instalator podstawia @HOST@ @NET@ @CERT@ @KEY@.
<VirtualHost *:80>
    ServerName @HOST@
    Redirect permanent / https://@HOST@/importy/
</VirtualHost>

<VirtualHost *:443>
    ServerName @HOST@
    SSLEngine on
    SSLCertificateFile    @CERT@
    SSLCertificateKeyFile @KEY@
    ErrorLog  ${APACHE_LOG_DIR}/importy-error.log
    CustomLog ${APACHE_LOG_DIR}/importy-access.log combined

    RedirectMatch ^/$ /importy/
    Alias /importy /opt/importy/www
    <Directory /opt/importy/www>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        DirectoryIndex index.html
        Require ip @NET@ 127.0.0.1 ::1
        Header set Cache-Control "no-cache"
    </Directory>
</VirtualHost>
